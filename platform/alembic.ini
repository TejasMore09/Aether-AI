[alembic]
script_location = migrations
prepend_sys_path = src
# URL is taken from AETHER_DATABASE_URL via migrations/env.py; this is a fallback.
sqlalchemy.url = postgresql+psycopg://aether:aether_dev_only@localhost:5433/aether

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
