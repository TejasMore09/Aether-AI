[project]
name = "aether-platform"
version = "0.1.0"
description = "Aether: control plane + per-tenant agent runtime for self-evolving business operations"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "pyjwt>=2.8",
    "temporalio>=1.7",
    "litellm>=1.44",
    "bcrypt>=4.1",
    "httpx>=0.27",
    "pyyaml>=6.0",
    # Local embeddings for the agent knowledge base. ONNX rather than torch:
    # ~50MB of runtime instead of ~2GB, and no GPU assumptions.
    "fastembed>=0.4",
    # Encrypting TOTP secrets at rest (6.6). The whole point of a second
    # factor is that it survives a password compromise, and a database leak
    # that hands over both defeats it — so the secret is encrypted with a key
    # that lives in the environment, not in the database.
    "cryptography>=43",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aether"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: `Depends(...)` in argument defaults is the canonical FastAPI pattern.
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "postgres: tests that require a running Postgres (docker compose up -d db)",
    "slow: tests that exercise the real embedding model (skipped unless downloaded)",
]
